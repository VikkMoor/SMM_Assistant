
{% extends "base.html" %}
{% block title %}Настройки{% endblock %}

{% block content %}
<h1 class="text-center">Настройки</h1>

<form method="POST">
    <h4>Настройки ВКонтакте</h4>

    <div class="form-group">
        <label for="vk_api_id">Токен доступа ВКонтакте:</label>
        <input
            type="password"
            name="vk_api_id"
            id="vk_api_id"
            class="form-control"
            value="{{ user.vk_api_id or '' }}"
            autocomplete="off"
        >
    </div>

    <div class="form-group">
        <label for="vk_group_id">ID сообщества ВКонтакте:</label>
        <input
            type="text"
            name="vk_group_id"
            id="vk_group_id"
            class="form-control"
            value="{{ user.vk_group_id or '' }}"
        >
    </div>

    <hr>

    <h4>Настройки OpenAI</h4>

    <div class="form-group">
        <label for="openai_api_key">OpenAI API Key:</label>
        <input
            type="password"
            name="openai_api_key"
            id="openai_api_key"
            class="form-control"
            placeholder="Введите OpenAI API Key"
            autocomplete="new-password"
        >

        {% if user.openai_api_key %}
            <small class="form-text text-success">
                API-ключ сохранён. Чтобы заменить его, введите новый.
            </small>
        {% else %}
            <small class="form-text text-muted">
                API-ключ пока не добавлен.
            </small>
        {% endif %}
    </div>

    <button type="submit" class="btn btn-primary btn-block">
        Сохранить
    </button>
</form>
{% endblock %}
